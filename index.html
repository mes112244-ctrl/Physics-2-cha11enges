<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>مختبر التحديات | فيزياء 2</title>
<style>ه
:root{--bg:#071426;--card:#10233d;--card2:#152c4b;--cyan:#5ee7e7;--gold:#ffd166;--txt:#f7fbff;--muted:#b8c7db;--ok:#49d17d;--bad:#ff6b6b;--purple:#8b7cff}
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:linear-gradient(135deg,#071426,#0c1f39 55%,#10294a);color:var(--txt);min-height:100vh}
header{padding:18px 5%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #29415e;background:#08182be8;position:sticky;top:0;z-index:5}
.logo{font-weight:800;font-size:20px}.logo span{color:var(--cyan)}.score{background:#152c4b;padding:9px 14px;border-radius:16px;color:var(--gold);font-weight:bold}
main{max-width:1000px;margin:auto;padding:28px 18px 60px}.hero{text-align:center;padding:28px 10px}.hero h1{font-size:clamp(28px,5vw,48px);margin:6px}.hero p{color:var(--muted);line-height:1.8}
.panel{background:#0d2038;border:1px solid #29415e;border-radius:24px;padding:22px;box-shadow:0 18px 50px #0004;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
input,select{width:100%;padding:14px;border-radius:14px;border:1px solid #36516f;background:#091a30;color:white;font-size:16px}
button{border:0;border-radius:14px;padding:13px 18px;font-weight:800;font-size:16px;cursor:pointer;background:var(--cyan);color:#06202a}
button.secondary{background:#223b5b;color:white}button:disabled{opacity:.55;cursor:not-allowed}
.activities{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}.activity{background:var(--card);border:1px solid #2d4968;border-radius:20px;padding:20px;cursor:pointer;transition:.2s}.activity:hover{transform:translateY(-3px);border-color:var(--cyan)}.activity .ico{font-size:42px}.activity h3{margin:10px 0 6px}.activity p{color:var(--muted);font-size:14px;line-height:1.6}
.hidden{display:none!important}.q{font-size:23px;line-height:1.8;text-align:center;margin:20px 0}.choices{display:grid;gap:12px}.choice{background:#183452;color:white;text-align:right}.choice:hover{background:#214668}.feedback{padding:14px;border-radius:14px;margin-top:15px;font-weight:bold;text-align:center}.ok{background:#153f2a;color:#8ff0b3}.bad{background:#4a2027;color:#ffadb5}.topline{display:flex;justify-content:space-between;gap:10px;align-items:center;color:var(--muted)}.timer{font-size:20px;color:var(--gold);font-weight:bold}.progress{height:8px;background:#223851;border-radius:8px;overflow:hidden;margin:12px 0}.bar{height:100%;background:var(--cyan);width:0}
.badge{display:inline-block;padding:6px 10px;border-radius:12px;background:#213a5c;color:var(--cyan);font-size:13px}.leader{width:100%;border-collapse:collapse}.leader td,.leader th{padding:12px;border-bottom:1px solid #29415e;text-align:right}.footer{text-align:center;color:#8296ae;margin-top:30px;font-size:13px}
@media(max-width:600px){header{padding:12px}.q{font-size:19px}.panel{padding:16px}}
</style>
</head>
<body>
<header><div class="logo">⚛️ <span>مختبر التحديات</span> | فيزياء 2</div><div class="score">⭐ <span id="score">0</span> نقطة</div></header>
<main>
<section id="login">
<div class="hero"><div style="font-size:64px">⚙️</div><h1>الشغل والآلات البسيطة</h1><p>تعاوني • ناقشي • جربي • اجمعي النقاط<br>كل إجابة تحتاج قرارًا واحدًا من المجموعة.</p></div>
<div class="panel"><h2>🚀 دخول المجموعة</h2><div class="grid">
<div><label>اسم المجموعة</label><input id="team" placeholder="مثال: نيوتن"></div>
<div><label>الشعبة</label><input id="section" placeholder="مثال: 2/5"></div>
</div><br><button onclick="start()">ابدئي التحدي ⚡</button></div>
</section>

<section id="home" class="hidden">
<div class="panel"><div class="topline"><div><span class="badge" id="who"></span></div><button class="secondary" onclick="showBoard()">🏆 لوحة النتائج</button></div>
<h2>اختاري محطة التحدي</h2><div class="activities" id="activities"></div></div>
</section>

<section id="game" class="hidden">
<div class="panel"><div class="topline"><button class="secondary" onclick="goHome()">← المحطات</button><div class="timer">⏱️ <span id="time">60</span></div></div>
<div class="progress"><div class="bar" id="bar"></div></div><div class="badge" id="gameTitle"></div>
<div class="q" id="question"></div><div class="choices" id="choices"></div><div id="feedback"></div>
<div style="display:flex;gap:10px;justify-content:center;margin-top:18px"><button id="hintBtn" class="secondary" onclick="hint()">💡 تلميح</button><button id="nextBtn" class="hidden" onclick="nextQ()">السؤال التالي ←</button></div>
</div></section>

<section id="board" class="hidden"><div class="panel"><div class="topline"><h2>🏆 لوحة النتائج على هذا الجهاز</h2><button class="secondary" onclick="goHome()">عودة</button></div><table class="leader"><thead><tr><th>#</th><th>المجموعة</th><th>الشعبة</th><th>النقاط</th></tr></thead><tbody id="rows"></tbody></table></div></section>
<div class="footer">الثانوية • فيزياء 2 • تعلم تعاوني قائم على التحدي</div>
</main>
<script>
const games=[
{icon:"🚪",title:"افتحي الخزنة",desc:"حلّي مسائل الشغل لتحصلي على رمز الخزنة.",qs:[
["دفعت طالبة صندوقًا بقوة 20 N مسافة 3 m في اتجاه القوة. مقدار الشغل؟",["6 J","23 J","60 J","600 J"],2,"استخدمي W = Fd عندما تكون القوة في اتجاه الإزاحة."],
["أثرت قوة 50 N في جسم لكنه لم يتحرك. الشغل المبذول على الجسم؟",["0 J","50 J","100 J","لا يمكن تحديده"],0,"الشغل يحتاج إلى إزاحة."],
["قوة 10 N حركت جسمًا 5 m في اتجاهها. أي رقم يفتح الخزنة؟",["2","15","50","500"],2,"اضربي القوة في الإزاحة."]
]},
{icon:"🎯",title:"صيد الخطأ",desc:"اكتشفي الحل الفيزيائي غير الصحيح.",qs:[
["قالت سارة: «إذا حملت حقيبة ثابتة لمدة دقيقة فأنا أبذل شغلًا ميكانيكيًا عليها». أين الخطأ؟",["لا يوجد خطأ","لا توجد إزاحة للحقيبة","القوة تساوي صفرًا","الزمن قصير"],1,"اسألي: هل تحرك الجسم في اتجاه القوة؟"],
["طالب حسب القدرة من العلاقة P = W × t. ما التصحيح؟",["P=W/t","P=F/t","P=t/W","P=W+d"],0,"القدرة تقيس معدل إنجاز الشغل."]
]},
{icon:"🧪",title:"مختبر الآلات",desc:"قارني القوة والمسافة في الآلات البسيطة.",qs:[
["آلة مثالية تقلل القوة اللازمة إلى النصف. ماذا يحدث تقريبًا للمسافة التي تؤثر خلالها القوة؟",["تنخفض للنصف","تتضاعف","لا تتغير","تصبح صفرًا"],1,"في الآلة المثالية: ما نكسبه في القوة ندفع مقابله مسافة."],
["إذا كانت القوة المقاومة 200 N والقوة المؤثرة 50 N، فما الفائدة الميكانيكية؟",["0.25","4","150","250"],1,"MA = القوة المقاومة ÷ القوة المؤثرة."]
]},
{icon:"⚙️",title:"اختاري الآلة",desc:"اختاري الآلة الأنسب للموقف.",qs:[
["تريدين رفع صندوق ثقيل إلى شاحنة باستخدام قوة أقل. أي خيار مناسب؟",["مستوى مائل","مسطرة فقط","ميزان حرارة","ساعة"],0,"الآلة المناسبة تزيد المسافة لتقلل القوة المطلوبة."],
["مقبض الباب مثال شائع على:",["بكرة","عجلة ومحور","إسفين","مستوى مائل"],1,"المقبض يدور حول محور."]
]},
{icon:"🏗️",title:"أنقذي العامل",desc:"اتخذي قرارًا هندسيًا وفسريه.",qs:[
["عامل يحتاج رفع حمل ثقيل رأسيًا. أي ترتيب يساعده على تقليل القوة أكثر؟",["حبل فقط","نظام بكرات مناسب","إسقاط الحمل","دفعه أفقيًا"],1,"زيادة عدد أجزاء الحبل الداعمة قد تزيد الفائدة الميكانيكية."],
["لماذا لا تعطي الآلات الحقيقية كفاءة 100% غالبًا؟",["لأن الطاقة تختفي","بسبب الاحتكاك وتحول بعض الطاقة لحرارة","لأن الشغل الناتج أكبر دائمًا","لأن الزمن يساوي صفرًا"],1,"فكري في الطاقة المتحولة إلى صور غير مفيدة."]
]},
{icon:"⚡",title:"سباق القدرة",desc:"من ينجز الشغل نفسه أسرع؟",qs:[
["أنجزت آلتان شغلًا مقداره 600 J. الأولى في 3 s والثانية في 6 s. أيهما قدرتها أكبر؟",["الأولى","الثانية","متساويتان","لا يمكن المقارنة"],0,"P=W/t"],
["شغل 1000 J أُنجز خلال 5 s. القدرة؟",["5 W","200 W","995 W","5000 W"],1,"اقسمي الشغل على الزمن."]
]},
{icon:"🧩",title:"ركّبي القانون",desc:"اختاري الصيغة الصحيحة.",qs:[
["أي علاقة تمثل الشغل عندما تكون القوة في اتجاه الإزاحة؟",["W=F/d","W=Fd","W=d/F","W=Ft"],1,"القوة × الإزاحة."],
["أي علاقة تمثل كفاءة الآلة؟",["الشغل الناتج ÷ الشغل المبذول ×100%","الشغل المبذول ÷ الناتج","القوة × الزمن","المسافة ÷ الزمن"],0,"قارني ما نحصل عليه بما ندخله."]
]},
{icon:"👑",title:"تحدي العالِمات",desc:"تحدٍ ختامي يجمع أكثر من مفهوم.",qs:[
["آلة استقبلت 500 J وأنتجت 400 J شغلًا مفيدًا. كفاءتها؟",["20%","80%","100%","125%"],1,"الكفاءة = الناتج ÷ المبذول ×100%"],
["طالبتان أنجزتا الشغل نفسه، لكن ريم أنهته في نصف زمن نورة. قدرة ريم تساوي:",["نصف قدرة نورة","قدرة نورة نفسها","ضعف قدرة نورة","أربع مرات"],2,"عند ثبات الشغل، القدرة تتناسب عكسيًا مع الزمن."]
]}
];
let state={team:"",section:"",score:0,g:0,q:0,answered:false,timer:null,time:60};
function start(){let t=document.getElementById("team").value.trim(),s=document.getElementById("section").value.trim();if(!t||!s){alert("اكتبي اسم المجموعة والشعبة أولًا 🌷");return}state.team=t;state.section=s;state.score=0;document.getElementById("score").textContent=0;document.getElementById("who").textContent=`👥 ${t} • ${s}`;renderActivities();show("home")}
function renderActivities(){let a=document.getElementById("activities");a.innerHTML="";games.forEach((g,i)=>{let d=document.createElement("div");d.className="activity";d.innerHTML=`<div class="ico">${g.icon}</div><h3>${g.title}</h3><p>${g.desc}</p>`;d.onclick=()=>openGame(i);a.appendChild(d)})}
function show(id){["login","home","game","board"].forEach(x=>document.getElementById(x).classList.add("hidden"));document.getElementById(id).classList.remove("hidden")}
function openGame(i){state.g=i;state.q=0;loadQ();show("game")}
function loadQ(){clearInterval(state.timer);state.answered=false;state.time=60;document.getElementById("time").textContent=60;document.getElementById("feedback").innerHTML="";document.getElementById("nextBtn").classList.add("hidden");document.getElementById("hintBtn").disabled=false;let g=games[state.g],q=g.qs[state.q];document.getElementById("gameTitle").textContent=`${g.icon} ${g.title} • ${state.q+1}/${g.qs.length}`;document.getElementById("question").textContent=q[0];document.getElementById("bar").style.width=((state.q)/g.qs.length*100)+"%";let c=document.getElementById("choices");c.innerHTML="";q[1].forEach((x,j)=>{let b=document.createElement("button");b.className="choice";b.textContent=x;b.onclick=()=>answer(j);c.appendChild(b)});state.timer=setInterval(()=>{state.time--;document.getElementById("time").textContent=state.time;if(state.time<=0){clearInterval(state.timer);if(!state.answered){state.answered=true;document.getElementById("feedback").innerHTML='<div class="feedback bad">⏰ انتهى الوقت. ناقشن السبب ثم انتقلن للسؤال التالي.</div>';document.getElementById("nextBtn").classList.remove("hidden")}}},1000)}
function answer(j){if(state.answered)return;state.answered=true;clearInterval(state.timer);let q=games[state.g].qs[state.q],correct=q[2];let f=document.getElementById("feedback");if(j===correct){let pts=100+Math.max(0,state.time);state.score+=pts;document.getElementById("score").textContent=state.score;f.innerHTML=`<div class="feedback ok">✅ رائع! +${pts} نقطة<br>${q[3]}</div>`}else{f.innerHTML=`<div class="feedback bad">🔎 ليست الإجابة الأدق.<br>${q[3]}</div>`}save();document.getElementById("nextBtn").classList.remove("hidden")}
function hint(){let q=games[state.g].qs[state.q];document.getElementById("feedback").innerHTML=`<div class="feedback" style="background:#263653;color:#ffd166">💡 ${q[3]}</div>`;document.getElementById("hintBtn").disabled=true}
function nextQ(){let g=games[state.g];if(state.q<g.qs.length-1){state.q++;loadQ()}else{document.getElementById("bar").style.width="100%";alert(`أحسنتم يا مجموعة ${state.team}! ⭐ مجموعكم الحالي ${state.score} نقطة`);goHome()}}
function goHome(){clearInterval(state.timer);show("home")}
function save(){let arr=JSON.parse(localStorage.getItem("physics2_board")||"[]");let x=arr.find(r=>r.team===state.team&&r.section===state.section);if(x)x.score=Math.max(x.score,state.score);else arr.push({team:state.team,section:state.section,score:state.score});localStorage.setItem("physics2_board",JSON.stringify(arr))}
function showBoard(){let arr=JSON.parse(localStorage.getItem("physics2_board")||"[]").sort((a,b)=>b.score-a.score);document.getElementById("rows").innerHTML=arr.length?arr.map((r,i)=>`<tr><td>${i+1}</td><td>${r.team}</td><td>${r.section}</td><td>⭐ ${r.score}</td></tr>`).join(""):'<tr><td colspan="4">لا توجد نتائج بعد.</td></tr>';show("board")}
</script></body></html>
